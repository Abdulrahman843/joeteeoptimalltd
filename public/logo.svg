<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="96" height="96" rx="18" fill="url(#bg)"/>

  <!-- Subtle inner border ring for depth -->
  <rect x="3" y="3" width="90" height="90" rx="15" fill="none" stroke="white" stroke-width="1" opacity="0.14"/>

  <!-- Bold letter J — the brand mark -->
  <g stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top horizontal cap -->
    <line x1="33" y1="24" x2="56" y2="24"/>
    <!-- Vertical stem -->
    <line x1="51" y1="24" x2="51" y2="60"/>
    <!-- Bottom hook curving left -->
    <path d="M51 60 Q51 76 40 76 Q29 76 29 65"/>
  </g>

  <!-- 4-pointed sparkle star — represents "clean &amp; fresh" -->
  <path d="M73 12 L75 17 L80 19 L75 21 L73 26 L71 21 L66 19 L71 17 Z" fill="#a7f3d0"/>

  <!-- Small accent dots for visual polish -->
  <circle cx="80" cy="30" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="64" cy="30" r="1.8" fill="#a7f3d0" opacity="0.55"/>
</svg>
